syntax_patterns:
- "double *buffer = calloc((size_t)nobs, sizeof(*buffer));"
- "pthread_create(&threads[i], NULL, worker, &args[i]);"
- "pthread_join(threads[i], NULL);"
- "if (SF_is_missing(value)) { /* explicit policy */ }"
- "dist = test_norm + donor_norm - 2.0 * dot_product;"
assumptions:
- A reproducible benchmark identifies the actual bottleneck, and a correct scalar baseline exists for equivalence testing.
- Thread count, RNG seeding, memory limits, and numerical tolerance are specified for every benchmark target.
gotchas:
- Optimization before profiling increases complexity without proving benefit; retain the baseline and measure wall time, allocations, and scaling.
- Parallel writes, shared RNG state, and reduction order can cause races or nondeterministic floating-point results.
- O(n*p) buffers can overflow size_t or exhaust memory at realistic Stata sizes; check dimensions before multiplication and allocation.
- A faster path must preserve missing-value, sort-order, tie, and error semantics exactly.
workflows:
- Benchmark the simplest correct implementation on fixed fixtures, profile, and identify one bottleneck.
- Apply one optimization at a time, rerun fidelity/memory/thread tests, and retain the change only when the prespecified performance target improves.
- Test single- and multi-thread modes across small, boundary, and stress inputs, including deterministic repeat runs with the same seed.
validation_case: Benchmark a scalar baseline against one optimized kernel on fixed seeded data, require output within the stated tolerance across repeated runs, and document speedup, memory use, and thread count.
validation_mode: manual-review
