title: Evidence-Driven Performance Patterns for Stata Plugins
trigger: Use when profiling or optimizing a Stata plugin with presorted indices, buffer reuse, dense arrays, partial sorting/quickselect, precomputed norms, pthreads, deterministic thread-local random number generators, cache locality, or missing-data fast paths.
