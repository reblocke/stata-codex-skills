assumptions:
- The plugin SDK files are pinned and verified, the target Stata release and architecture are known, and a pure ado/Mata implementation is insufficient for the workload.
- The ado wrapper has already validated syntax, variable types, if/in sample, output storage, and argument count before invoking native code.
gotchas:
- A plugin crash terminates the Stata process; every pointer, allocation, observation/variable index, and SDK return code is a session-safety boundary.
- SDK observation and variable indices are 1-based, while C arrays are 0-based. Make every conversion explicit.
- Stata numeric missing values require SDK-aware handling; ordinary NaN or sentinel assumptions can silently corrupt results.
- Return 0 only after all writes succeed. Report an explanatory SF_error() message and nonzero Stata-compatible code on failure.
workflows:
- Pin stplugin.h/stplugin.c by URL and SHA-256, compile the official minimal example for the current target, and retain compiler diagnostics.
- Keep stata_call thin; parse/validate in the ado wrapper, read only the marked sample, call a tested computational routine, then check every write.
- Run compilation in the default gate and execute the plugin only in an explicit batch integration test because loader failures can hang or crash Stata.
validation_case: Compile the pinned official hello plugin for the host architecture, verify the expected binary exists, and separately load/call it in an explicitly selected batch runtime test requiring an exact completion marker.
validation_mode: compilation
