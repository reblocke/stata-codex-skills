title: Safe C++ Wrappers for Stata Plugins
trigger: Use when a Stata plugin needs C++, extern "C", STL containers, exception containment, a vendored C++ backend, separate C/C++ compilation, cross-platform linking, or investigation of name-mangling and loader errors.
