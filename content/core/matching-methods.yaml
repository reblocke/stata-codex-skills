slug: matching-methods
skill: core
section: Causal Inference
order: 430
title: Propensity-Score and Nearest-Neighbor Matching
trigger: >-
  Use for treatment-effects matching with teffects psmatch or teffects nnmatch, propensity scores,
  overlap, common support, balance assessment, average treatment effects, and matched-sample diagnostics.
commands: [teffects psmatch, teffects nnmatch, tebalance summarize, tebalance density, predict]
aliases: [propensity-score matching, propensity score matching, PSM, nearest-neighbor matching, covariate balance]
source_topics: [teffects_psmatch, teffects_nnmatch, tebalance]
syntax_patterns:
- teffects psmatch (outcome) (treated covariates), atet nneighbor(1)
- teffects nnmatch (outcome covariates) (treated), ate nneighbor(3) biasadj(covariates)
- tebalance density, name(propensity_balance, replace)
assumptions:
- Treatment is conditionally exchangeable given measured pretreatment covariates, with consistency and no interference.
- Treated and comparison units have sufficient propensity-score or covariate overlap for the requested estimand.
gotchas:
- Matching cannot balance unmeasured confounders and does not make a causal design credible by itself.
- Balance must be assessed after matching; predictive propensity-model fit is not the objective.
- Poor overlap can make an ATE depend on extrapolation even when an ATET remains supportable.
workflows:
- Define the estimand and pretreatment covariates, inspect overlap, match, and evaluate standardized balance before outcomes.
- Report unmatched units, matching settings, balance, and sensitivity to neighbor count or caliper-like restrictions.
validation_case: >-
  Estimate an ATET with propensity-score matching on bundled data, then run tebalance summarize and confirm
  the estimation sample is nonempty.
validation_mode: stata
related_refs: [treatment-effects, descriptive-statistics]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  teffects psmatch (price) (foreign mpg weight), atet
  assert e(N) > 0
  tebalance summarize
provenance:
