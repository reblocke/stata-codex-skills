slug: sem-factor-analysis
skill: core
section: Advanced Methods
order: 620
title: Factor Analysis and Structural Equation Models
trigger: >-
  Use for exploratory factor analysis, latent-variable measurement models, path models, SEM, generalized SEM,
  identification constraints, standardized estimates, fit statistics, and latent-variable predictions.
commands: [factor, rotate, predict, sem, gsem, estat gof, estat mindices]
aliases: [factor analysis, EFA, confirmatory factor analysis, CFA, SEM, GSEM, latent variable, path analysis]
source_topics: [sem, gsem_command, factor]
syntax_patterns:
- factor item1-item6, factors(2) pcf
- sem (Latent -> item1 item2 item3) (outcome <- Latent covariates)
- estat gof, stats(all)
assumptions:
- The latent-variable structure is identified through adequate indicators, scale constraints, and substantively justified paths.
- Distributional, link-function, and missing-data assumptions match the selected factor, sem, or gsem estimator.
gotchas:
- Good global fit does not validate causal direction or rescue a model chosen by modification indices alone.
- Latent-variable scales depend on marker or variance constraints, which affect coefficient interpretation.
- Factor retention should not rely on eigenvalues greater than one without scree, parallel, and substantive evidence.
workflows:
- Inspect item distributions and correlations, prespecify the measurement structure, and check identification before estimation.
- Evaluate loadings, residuals, fit, and theoretically plausible alternatives while separating exploratory from confirmatory changes.
validation_case: >-
  Fit a one-factor model to three related bundled variables, verify convergence, and inspect standardized loadings.
validation_mode: stata
related_refs: [maximum-likelihood, descriptive-statistics]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  factor weight length turn, factors(1)
  sem (Size -> weight length turn)
  assert e(converged) == 1
  assert e(N) == 74
provenance:
  local_help_topics: [sem, gsem_command, factor]
