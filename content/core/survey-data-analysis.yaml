slug: survey-data-analysis
skill: core
section: Statistics and Econometrics
order: 280
title: Complex Survey Design and Estimation
trigger: >-
  Use for probability weights, strata, primary sampling units, finite-population corrections,
  subpopulation analyses, design-based means or proportions, and svy-prefixed regression.
commands: [svyset, svydescribe, svy, subpop(), estat effects]
aliases: [survey weights, pweights, complex survey, design-based analysis, PSU, strata, subpopulation]
routing_terms:
- svyset survey design
- svy prefix estimation
- subpop() domain analysis
- primary sampling unit specification
- finite population correction in Stata
- estat effects after svy
source_topics: [svyset, svy, svy_estimation]
syntax_patterns:
- svyset psu [pweight=weight], strata(stratum) fpc(fpc)
- "svy: mean outcome"
- "svy, subpop(eligible): proportion outcome"
- "svy: regress outcome exposure covariates"
assumptions:
- Weights, strata, PSUs, and finite-population corrections correctly encode the sampling design.
- The target population and any subpopulation indicator are defined consistently with survey eligibility and nonresponse.
gotchas:
- Applying weights without strata and PSU variables does not reproduce the full survey design variance.
- if restricts the estimation data, whereas subpop() retains full-design information for domain variance estimation.
- Single-PSU strata require an explicit, justified handling rule and can otherwise make standard errors missing.
workflows:
- Translate the survey documentation into svyset, run svydescribe, and verify weight, stratum, and PSU ranges.
- Use subpop() for domain estimates, report design degrees of freedom, and compare weighted and unweighted denominators.
validation_case: >-
  Declare a synthetic stratified clustered design with pweights, estimate a survey mean, and verify the design
  degrees of freedom are positive.
validation_mode: stata
related_refs: [descriptive-statistics, missing-data-handling]
install_commands: []
smoke_test: |-
  clear
  set obs 40
  generate int psu = ceil(_n/5)
  generate byte stratum = ceil(psu/4)
  generate double weight = 1 + mod(_n, 3)/10
  generate double outcome = 10 + stratum + mod(_n, 5)
  svyset psu [pweight=weight], strata(stratum)
  svy: mean outcome
  assert e(N) == 40
  assert e(df_r) > 0
provenance:
  local_help_topics: [svyset, svy, svy_estimation]
  local_help_globs: []
  local_help_files:
  - ado/base/s/svyset.sthlp
  - ado/base/s/svy.sthlp
  - ado/base/s/svy_estimation.sthlp
  upstream_files:
  - plugins/stata/skills/stata/references/survey-data-analysis.md
  upstream_only: false
  package_only: false
  reviewed: true
