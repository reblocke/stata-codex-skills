slug: programming-basics
skill: core
section: Programming and Mata
order: 10
title: Stata macros, loops, and do-files
trigger: >-
  Use for `local` and `global` macros, `foreach` and `forvalues` loops, do-file arguments, comments,
  command delimiters, temporary names, `quietly`/`noisily`, `capture`, and basic reusable automation.
commands: [local, global, foreach, forvalues, do, run, tempfile, tempname, capture, quietly]
aliases: [Stata programming, macro, loop, foreach, forvalues, do-file, automation]
routing_terms:
- local macro expansion
- global macro scope
- foreach loop
- forvalues loop
- do-file arguments
- tempfile and tempname
- capture command errors
- quietly run a Stata command
source_topics: [foreach, forvalues, macro, do]
syntax_patterns: []
assumptions:
- The loop examples require an existing numeric `base` variable with values 1 through 5; the `do` line requires its named file and arguments.
- Repeated commands are safe at each iteration and produce uniquely named or intentionally replaced outputs.
gotchas:
- "`local` macros disappear outside their defining scope; globals persist and can create hidden cross-script state."
- Macro expansion happens before command parsing, so unmatched quotes or apostrophes can change the command silently.
- "`capture` suppresses the return code unless checked immediately and can conceal a failed iteration."
workflows:
- Prototype one concrete command, parameterize only the changing pieces, then inspect expanded commands on a small loop.
- Use `local` macros and temporary files by default, check `_rc` after expected failures, and make reruns idempotent.
validation_case: >-
  Execute the published `foreach` and `forvalues` bodies after their declared setup, then verify expansion and final values.
validation_mode: stata
related_refs: [advanced-programming, workflow-best-practices]
install_commands: []
smoke_test: null
examples:
- id: core-loop-foreach
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [A numeric `base` variable with values 1 through 5.]
  code: |-
    local powers "2 3"
    foreach power of local powers {
        generate double value`power' = base^`power'
    }
  test_id: core-loop-foreach
  fixture: tests/stata/examples/core-loop-foreach.yaml
  expected_rc: 0
- id: core-loop-forvalues
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [A numeric `value2` variable equal to the square of row number for rows 1 through 5.]
  code: |-
    forvalues row = 1/5 {
        assert value2[`row'] == `row'^2
    }
  test_id: core-loop-forvalues
  fixture: tests/stata/examples/core-loop-forvalues.yaml
  expected_rc: 0
- id: core-do-arguments
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [An `analysis.do` file that accepts the two positional path arguments.]
  code: do "analysis.do" input_path output_path
