slug: gmm-estimation
skill: core
section: Statistics and econometrics
order: 310
title: Generalized method of moments estimation
trigger: >-
  Use for one- or multiple-equation moment-condition models, instrument sets, one- and two-step GMM,
  robust weighting matrices, overidentification tests, and postestimation with `gmm`.
commands: [gmm, estat overid, predict]
aliases: [GMM, generalized method of moments, moment conditions, instruments, overidentification]
routing_terms:
- gmm command
- moment conditions in Stata
- two-step GMM weighting
- estat overid after gmm
- nonlinear GMM evaluator
- instrument equations in gmm
source_topics: [gmm, gmm_postestimation]
syntax_patterns:
- gmm (outcome - {b1}*x1 - {b2}*x2 - {b0}), instruments(x1 x2)
- "gmm (equation1) (equation2), instruments(1: z1 z2) instruments(2: z1 z3) twostep"
assumptions:
- Population moment conditions are correctly specified and instruments are exogenous for the stated structural error.
- Parameters are identified with instruments strong enough for the intended asymptotic approximation.
gotchas:
- Moment validity is a substantive assumption; adding instruments can worsen finite-sample bias even when precision rises.
- Weak or many instruments can make conventional GMM inference unreliable.
- One-step and two-step estimates use different weighting matrices, and finite-sample corrections should be reported.
workflows:
- State each orthogonality condition and instrument source before encoding the moment equations.
- Fit a parsimonious one-step model, inspect convergence and moments, then evaluate two-step and overidentification diagnostics.
validation_case: >-
  Estimate a linear moment-condition model on bundled data, verify convergence and sample size, and inspect
  postestimation overidentification output when degrees of freedom permit.
validation_mode: stata
related_refs: [maximum-likelihood, linear-regression]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  gmm (mpg - {b1}*gear_ratio - {b2}*turn - {b0}), instruments(gear_ratio turn)
  assert e(converged) == 1
  assert e(N) == 74
provenance:
