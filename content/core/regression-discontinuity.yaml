slug: regression-discontinuity
skill: core
section: Causal Inference
order: 420
title: Manual Regression-Discontinuity Workflow with Built-in Stata
trigger: >-
  Use for a transparent built-in sharp or fuzzy regression-discontinuity workflow using regress, lpoly,
  and twoway; includes cutoff coding, local bandwidths, side-specific slopes, sensitivity, placebo cutoffs,
  density inspection, and covariate-continuity checks. Route robust bias-corrected inference to rdrobust.
commands: [regress, ivregress 2sls, lpoly, twoway scatter, twoway lfit, histogram]
aliases: [regression discontinuity, regression-discontinuity, RD, RDD, cutoff design, local linear regression]
routing_terms:
- regression discontinuity
- manual built-in RD workflow
- sharp cutoff with local linear slopes
- fuzzy cutoff with ivregress 2sls
- placebo cutoff check
- covariate continuity at cutoff
- density inspection around cutoff
- bandwidth sensitivity for RD
source_topics: [regress, lpoly, graph_twoway, twoway_lpoly]
syntax_patterns:
- generate double centered = running - cutoff
- generate byte above = centered >= 0 if !missing(centered)
- regress outcome i.above##c.centered if abs(centered) <= bandwidth, vce(robust)
- generate double side_slope = above*centered
- ivregress 2sls outcome centered side_slope (treatment = above) if abs(centered) <= bandwidth, vce(robust)
- lpoly outcome centered if centered < 0 & abs(centered) <= bandwidth, nograph degree(1)
- twoway (scatter outcome centered) (lfit outcome centered if centered < 0) (lfit outcome centered if centered >= 0), xline(0)
assumptions:
- Potential outcomes are continuous at the cutoff absent treatment, with no precise manipulation of the running variable.
- The cutoff, assignment rule, bandwidth, polynomial order, and outcome timing are defined independently of observed effects.
gotchas:
- Stata has no built-in rd command; do not infer provenance or syntax from unrelated help files containing the letters rd.
- Global high-order polynomials can create unstable boundary behavior and misleading discontinuity estimates.
- Conventional regress standard errors do not provide robust bias-corrected local-polynomial inference.
- Sorting or heaping at the cutoff and discontinuities in baseline covariates threaten design validity.
workflows:
- Center the running variable, verify treatment assignment, plot raw data and separate local fits, then estimate a prespecified local linear model.
- Repeat plausible bandwidths and polynomial orders, inspect placebo cutoffs and covariates, and route publication-grade robust inference to rdrobust.
validation_case: >-
  Generate a sharp cutoff with a known jump, estimate side-specific local linear slopes within a fixed bandwidth,
  verify a positive discontinuity, and run a placebo cutoff model.
validation_mode: stata
related_refs: [linear-regression, graphics, rdrobust]
install_commands: []
smoke_test: |-
  clear
  set obs 200
  generate double centered = _n - 100.5
  generate byte above = centered >= 0
  generate double outcome = 2*above + 0.05*centered + 0.02*above*centered + 0.1*sin(_n)
  regress outcome i.above##c.centered if abs(centered) <= 40, vce(robust)
  assert _b[1.above] > 0
  lpoly outcome centered if abs(centered) <= 40, degree(1) nograph
  generate double placebo_centered = centered + 50
  generate byte placebo_above = placebo_centered >= 0
  regress outcome i.placebo_above##c.placebo_centered if abs(placebo_centered) <= 20, vce(robust)
  assert abs(_b[1.placebo_above]) < 0.5
