slug: string-functions
skill: core
section: Data operations
order: 150
title: String and Unicode functions in Stata
trigger: >-
  Use for cleaning, splitting, searching, matching, normalizing, and measuring text with string and Unicode
  functions, including split, substr(), strpos(), regexm(), ustrregexm(), and ustrlen().
commands:
- split
- substr()
- strpos()
- regexm()
- regexs()
- ustrregexm()
- ustrnormalize()
- ustrlen()
aliases: [string cleaning, text parsing, regular expression, regex, Unicode, split string]
routing_terms:
- regexm() match
- regexs() capture group
- ustrregexm() Unicode regex
- ustrnormalize() Unicode normalization
- split string variable
- substr() extraction
- strpos() search
source_topics:
- string_functions
- split
- f_regexm
- f_ustrlen
syntax_patterns:
- split full_name, parse(" ") generate(name_)
- generate byte valid = regexm(code, "^[A-Z][0-9]{3}$")
- generate int characters = ustrlen(ustrnormalize(label, "nfc"))
assumptions:
- Text encoding, case sensitivity, normalization, delimiters, and the intended language rules are known.
- The regular expression or parsing rule is validated against representative valid and invalid examples.
gotchas:
- substr() counts bytes for Unicode text; use Unicode-aware ustr* functions when characters may be multibyte.
- regexs() returns captures from the most recent successful regexm() evaluation, so generate captures immediately.
- split may create a variable number of outputs and silently expose inconsistent delimiters or repeated spaces.
workflows:
- Preserve the original text, normalize case and Unicode in a new variable, then validate transformations with frequency tables.
- Define an anchored regular expression, generate a match flag, inspect nonmatches, and only then extract capture groups.
validation_case: >-
  Split a small name field, validate an anchored identifier pattern, and confirm Unicode-aware character lengths.
validation_mode: stata
related_refs:
- data-management
- date-time-functions
install_commands: []
smoke_test: |-
  clear
  input str20 full_name str4 code
  "Ada Lovelace" "A123"
  "Grace Hopper" "bad"
  end
  split full_name, parse(" ") generate(name_)
  generate byte valid = regexm(code, "^[A-Z][0-9][0-9][0-9]$")
  generate int characters = ustrlen(full_name)
  assert valid[1] == 1
  assert valid[2] == 0
  assert name_1[1] == "Ada"
provenance:
  local_help_topics: [string_functions, split, f_regexm, f_ustrlen]
