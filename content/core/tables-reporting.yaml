slug: tables-reporting
skill: core
section: Output and Workflow
order: 520
title: Built-in Tables, Collections, and Office Export
trigger: >-
  Use for descriptive or model tables with table and etable, collection layout and styling,
  previewing results, and exporting controlled outputs with collect, putexcel, putdocx, or putpdf.
commands: [table, etable, collect, collect preview, collect layout, collect export, putexcel, putdocx, putpdf]
aliases: [reporting table, publication table, etable, collect, Excel export, Word export]
routing_terms:
- regression table
- collect layout
- collect export
- etable regression table
- putexcel workbook
- putdocx report
- putpdf report
- style a Stata collection
source_topics: [etable, collect_preview, table, putexcel]
syntax_patterns:
- table group, statistic(n outcome) statistic(mean outcome) statistic(sd outcome)
- etable, estimates(model1 model2) column(index)
- collect layout (colname) (result)
- collect export "table.xlsx", replace
assumptions:
- Each displayed statistic has a defined numerator, denominator, unit, sample, and uncertainty convention.
- Collection dimensions and labels uniquely identify every result before styling or export.
gotchas:
- Formatting cannot repair an incorrect denominator or silently mixed estimation samples.
- collect retains session state until cleared; stale collections can contaminate reruns.
- Exported spreadsheets and documents may render differently from the Stata preview and require artifact inspection.
workflows:
- Compute and validate statistics before styling, then build a small collection with explicit row and column dimensions.
- Clear stale state, render deterministically, export to a temporary or approved path, and inspect the final artifact.
validation_case: >-
  Build a descriptive table and an etable from bundled data, preview each collection, and clear collection state.
validation_mode: stata
related_refs: [graphics, workflow-best-practices]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  collect clear
  table foreign, statistic(n price) statistic(mean price)
  collect preview
  assert "`s(collection)'" != ""
  assert real("`s(k_tables)'") >= 1
  collect clear
  regress price mpg weight
  etable
  collect preview
  assert "`s(collection)'" != ""
  assert real("`s(k_tables)'") >= 1
  collect clear
provenance:
  local_help_topics: [etable, collect_preview, collect_layout, collect_export, table, putexcel, putdocx_intro, putpdf_intro]
  local_help_globs: []
  local_help_files:
