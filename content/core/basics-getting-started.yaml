slug: basics-getting-started
skill: core
section: Data operations
order: 110
title: "Stata basics: Getting started guide"
trigger: >-
  Use for opening, inspecting, browsing, saving, and reloading Stata datasets, including
  use, sysuse, describe, summarize, list, browse, save, clear, and first-session orientation.
commands:
- use
- sysuse
- describe
- summarize
- list
- browse
- save
- clear
aliases: [Stata basics, open dataset, inspect data, browse data, save dataset, sysuse]
routing_terms:
- first Stata session
- sysuse auto
- inspect a .dta dataset
- describe variable metadata
- browse observations interactively
- reload a Stata dataset
source_topics:
- use
- save
- describe
- edit
- sysuse
syntax_patterns:
- use "analysis.dta", clear
- sysuse auto, clear
- describe id outcome exposure
- save "analysis_copy.dta", replace
assumptions:
- The requested input is a Stata-readable dataset and the user has permission to access its path.
- Opening or saving the dataset will not overwrite the only authoritative copy of raw data.
gotchas:
- use without clear refuses to overwrite unsaved data in memory; verify whether the current data need saving first.
- browse opens an interactive viewer and is unsuitable as the only inspection step in unattended batch runs.
- save, replace overwrites an existing file, so use it only for an intentional derived-data target.
workflows:
- Open a known dataset, inspect its dimensions and variable metadata, and assert basic expectations before analysis.
- Save transformed data to a new path and reload it to verify that storage types, labels, and row counts survived.
validation_case: >-
  Load the bundled auto dataset, verify its observation count and variable metadata, save it to a temporary
  file, reload it, and assert the count again.
validation_mode: stata
related_refs:
- data-management
- workflow-best-practices
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  describe price mpg
  assert _N == 74
  tempfile copy
  save `copy'
  clear
  use `copy', clear
  assert _N == 74
