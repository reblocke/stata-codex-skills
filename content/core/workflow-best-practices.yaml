slug: workflow-best-practices
skill: core
section: Output and workflow
order: 530
title: Reproducible Stata project and do-file workflow
trigger: >-
  Use for versioned `.do` files, project-relative paths, logs, deterministic seeds, temporary files,
  assertions, error handling, modular execution, clean-session reproduction, artifact separation,
  and unattended or locked-screen execution.
commands: [version, pwd, cd, log using, do, run, assert, tempfile, set seed, exit]
aliases: [reproducible workflow, Stata project, do-file organization, batch mode, logging, clean run, unattended execution, locked-screen execution]
routing_terms:
- batch-mode Stata run
- project-relative Stata paths
- versioned analysis do-file
- log using in batch
- clean-session reproduction
- deterministic project seed
- separate raw and derived data
- assert pipeline invariants
- scheduled Stata execution
- Stata completion dialog
- Stata run waiting for screen unlock
source_topics: [log, version, cd]
syntax_patterns:
- cd "`project_root'"
- log using "`output_dir'/analysis.log", text replace name(analysis)
- assert _N == expected_rows
- do "scripts/01_build_cohort.do"
assumptions:
- Raw inputs are immutable, and every generated file has an explicit derived-data or output destination.
- The declared Stata version, package environment, paths, seeds, and execution order are sufficient for a clean rerun.
gotchas:
- "`cd` and globals create session state that can make a `.do` file work only after an undocumented manual setup."
- "`version` controls command behavior but does not pin community packages, operating-system tools, or external data."
- "`capture` without checking `_rc` can convert a failed pipeline step into an apparently successful run."
- "A launcher exit status of zero or a completion marker followed by forced termination does not prove successful unattended execution."
workflows:
- Start from a clean session, declare `version` and paths, open a run-specific log, and fail early on missing inputs or schema violations.
- Separate immutable inputs, intermediate data, reports, and temporary files; rerun end to end and inspect logs and artifacts.
- For terminal or scheduled jobs, use [unattended execution](unattended-execution.md) to qualify the launcher and retain fresh Stata return-code evidence alongside project assertions.
validation_case: >-
  Execute the same seeded temporary-data workflow in two independent clean Stata sessions and compare its declared count and mean.
validation_mode: stata
clean_repetitions: 2
related_refs: [programming-basics, basics-getting-started]
install_commands: []
smoke_test: |-
  clear all
  version 18
  pwd
  set seed 271828
  tempfile derived
  set obs 10
  generate double value = runiform()
  save `derived'
  use `derived', clear
  assert _N == 10
  assert !missing(value)
  quietly summarize value, meanonly
  display "CODEX_RESULT: N=" r(N) " mean=" %21.17g r(mean)
