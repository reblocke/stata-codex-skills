slug: variables-operators
skill: core
section: Data operations
order: 140
title: Variables, types, missing values, and operators
trigger: >-
  Use for `generate` and `replace` expressions, numeric and string storage types, missing values, `if` qualifiers,
  logical and arithmetic operators, factor-variable notation, and observation subscripting.
commands:
- generate
- replace
- recast
- compress
- missing()
- inlist()
- inrange()
- if
aliases: [variable type, missing value, generate variable, replace variable, logical operator, factor variable]
routing_terms:
- generate expression
- factor-variable notation
- missing values sort above numbers
- storage type with recast
- compress variable storage
- logical operators in Stata
- inlist() and inrange()
- observation subscripting in Stata
source_topics:
- generate
- missing
- if
- functions
syntax_patterns:
- |-
  generate byte adult_unknown_preserved = .
  replace adult_unknown_preserved = age >= 18 if !missing(age)
- generate byte adult_missing_as_false = age >= 18 & !missing(age)
- replace category = 1 if inlist(code, "A", "B")
- generate double ratio = numerator / denominator if denominator != 0 & !missing(denominator)
assumptions:
- Each variable's storage type, coding scheme, unit, and missing-value representation are understood.
- Boolean classifications define how missing and out-of-domain values should be handled.
gotchas:
- Numeric missing values sort above every real number, so `age > 65` also selects missing age unless guarded.
- A single equals sign (`=`) assigns a value; double equals (`==`) tests equality inside expressions and qualifiers.
- Preserve identifiers as their original strings when leading zeros or long digits matter; converting a rounded numeric ID to `double` cannot recover lost digits.
- Logical expressions involving strings and numeric missing values follow different missing-value conventions.
workflows:
- Inspect storage types and missingness, `generate` into a new variable, `tabulate` the result with `missing`, then `replace` only verified cases.
- Use explicit parentheses in expressions that mix `&` and `|`, and `assert` impossible states after classification.
validation_case: >-
  Test ordinary and extended numeric missing values under separately named unknown-preserving and missing-as-false policies;
  retain long string identifiers with leading zeros exactly.
validation_mode: stata
related_refs:
- data-management
- mathematical-functions
install_commands: []
smoke_test: |-
  clear
  input double age
  17
  21
  .
  .a
  end
  generate byte adult_unknown_preserved = .
  replace adult_unknown_preserved = age >= 18 if !missing(age)
  generate byte adult_missing_as_false = age >= 18 & !missing(age)
  assert adult_unknown_preserved == 0 in 1
  assert adult_unknown_preserved == 1 in 2
  assert missing(adult_unknown_preserved) in 3/4
  assert adult_missing_as_false == 0 in 3/4
  assert age[4] == .a
  clear
  input str18 person_id
  "000012345678901234"
  "123456789012345678"
  end
  isid person_id
  assert person_id[1] == "000012345678901234"
  assert person_id[2] == "123456789012345678"
