slug: time-series
skill: core
section: Statistics and Econometrics
order: 250
title: Time-Series Setup, Dynamic Models, and Forecasting
trigger: >-
  Use for declaring time-series data, lags and differences, ARIMA models, vector autoregressions,
  lag-order selection, forecasts, and impulse-response functions with tsset, arima, var, and irf.
commands: [tsset, tsreport, arima, var, varsoc, irf, forecast]
aliases: [time series, ARIMA, ARMA, VAR, lag operator, impulse response, IRF]
source_topics: [tsset, arima, var, irf]
syntax_patterns:
- tsset calendar_month, monthly
- arima outcome covariates, arima(1,0,1)
- var outcome1 outcome2, lags(1/2)
- irf create baseline, step(12)
assumptions:
- The time index is correctly spaced and the modeled series is stationary after any declared transformations.
- Innovations, lag structure, and forecast evaluation design match the chosen ARIMA or VAR specification.
gotchas:
- Time operators require a correctly declared and uniquely indexed time variable; gaps affect lags and differences.
- Nonstationary series can create spurious relationships, so inspect trends, seasonality, and integration before modeling.
- Lag order and forecast horizon should be selected without using future observations from the evaluation period.
workflows:
- Verify time uniqueness and spacing, plot the series, assess transformations, and reserve a chronological validation window.
- Fit a prespecified dynamic model, check residual diagnostics and stability, then evaluate forecasts or IRFs with uncertainty.
validation_case: >-
  Create a deterministic regularly spaced series, declare it with tsset, verify a lag, and fit a stable first-order VAR.
validation_mode: stata
related_refs: [panel-data, graphics]
install_commands: []
smoke_test: |-
  clear
  set obs 80
  generate int time = _n
  generate double x = sin(_n/5)
  generate double y = cos(_n/7) + 0.4*x
  tsset time
  generate double lag_x = L.x
  assert abs(lag_x[2] - x[1]) < 1e-12
  var y x, lags(1)
  assert e(N) == 79
provenance:
  local_help_topics: [tsset, arima, var, irf]
  local_help_globs: []
  local_help_files:
  - ado/base/t/tsset.sthlp
  - ado/base/a/arima.sthlp
  - ado/base/v/var.sthlp
  - ado/base/i/irf.sthlp
  upstream_files:
  - plugins/stata/skills/stata/references/time-series.md
  upstream_only: false
  package_only: false
  reviewed: true
