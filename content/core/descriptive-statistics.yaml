slug: descriptive-statistics
skill: core
section: Statistics and econometrics
order: 210
title: Descriptive statistics and distribution checks
trigger: >-
  Use for means, medians, ranges, percentiles, frequency tables, cross-tabulations, correlations, codebooks,
  and distribution checks with summarize, tabulate, tabstat, codebook, correlate, and pwcorr.
commands: [summarize, tabulate, tabstat, codebook, correlate, pwcorr]
aliases: [summary statistics, descriptive statistics, frequency table, crosstab, correlation]
routing_terms:
- summarize detail percentiles
- tabstat by group
- two-way frequency table
- codebook variables
- pwcorr with significance
- distribution percentiles in Stata
- cross-tabulation with tabulate
source_topics: [summarize, tabulate, tabstat, codebook, correlate]
syntax_patterns:
- summarize price mpg, detail
- tabulate foreign rep78, missing row
- tabstat price mpg, by(foreign) statistics(n mean sd p50 min max)
- pwcorr price mpg weight, obs sig
assumptions:
- The analysis unit, denominator, subgroup definitions, and variable units are correct for each summary.
- The selected summaries are appropriate for the variable distributions and sampling design.
gotchas:
- summarize and correlate use available observations differently when variables have different missingness; report denominators.
- Frequency tables omit missing values unless missing is requested, which can hide data-quality problems.
- A correlation describes pairwise association and does not establish scale agreement, causality, or model adequacy.
workflows:
- Start with codebook and missing-inclusive tabulations, then report distribution-aware summaries at the analysis denominator.
- Compare overall and subgroup distributions using the same statistics and explicitly inspect sparse categories and outliers.
validation_case: >-
  Summarize a bundled dataset overall and by group, verify the complete-case denominator, and inspect a missing-inclusive table.
validation_mode: stata
related_refs: [linear-regression, survey-data-analysis]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  summarize price mpg, detail
  assert r(N) == 74
  tabulate foreign, missing
  tabstat price mpg, by(foreign) statistics(n mean sd)
  correlate price mpg weight
provenance:
  local_help_topics: [summarize, tabulate, tabstat, codebook, correlate]
  local_help_globs: []
  local_help_files:
  - ado/base/s/summarize.sthlp
  - ado/base/t/tabulate.sthlp
  - ado/base/t/tabstat.sthlp
  - ado/base/c/codebook.sthlp
  - ado/base/c/correlate.sthlp
  upstream_files:
  - plugins/stata/skills/stata/references/descriptive-statistics.md
  upstream_only: false
  package_only: false
  reviewed: true
