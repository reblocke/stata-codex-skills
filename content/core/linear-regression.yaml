slug: linear-regression
skill: core
section: Statistics and econometrics
order: 220
title: Linear and instrumental-variables regression
trigger: >-
  Use for ordinary least squares, robust or clustered standard errors, factor-variable interactions,
  instrumental-variables regression, adjusted predictions, marginal effects, and fitted values.
commands: [regress, ivregress, margins, marginsplot, predict]
aliases: [reg, OLS, linear regression, 2SLS, IV regression, robust standard errors, clustered standard errors]
routing_terms:
- ordinary least squares with regress
- ivregress 2sls
- robust standard errors after regress
- clustered standard errors after regress
- factor-variable interaction in OLS
- marginal effects after linear regression
source_topics: [regress, ivregress, margins, predict]
syntax_patterns:
- regress outcome c.exposure##i.group covariates, vce(robust)
- regress outcome exposure covariates, vce(cluster cluster_id)
- ivregress 2sls outcome covariates (exposure = instrument), vce(robust)
- margins group, at(exposure=(0 1 2))
- predict double fitted, xb
assumptions:
- The conditional mean is correctly specified for the target contrast and observations are independent at the variance unit.
- For IV regression, instruments are relevant and affect the outcome only through the endogenous exposure under the stated model.
gotchas:
- Factor-variable notation preserves base categories and enables margins; manually generated interactions are easier to misinterpret.
- Robust and clustered standard errors change inference, not the estimand; clusters must match the dependence structure.
- IV estimates require instrument relevance and an exclusion restriction that model output cannot establish.
- predict is estimation-command specific, so confirm whether xb, residuals, or another statistic is being generated.
workflows:
- Define outcome, exposure, covariates, functional form, and variance estimator before fitting; then inspect residual and influence diagnostics.
- For IV models, document the causal instrument argument, inspect first-stage strength, and compare with the non-IV specification.
validation_case: >-
  Fit OLS with a factor variable and robust standard errors, calculate adjusted predictions, generate fitted values,
  and verify that estimation and prediction samples agree.
validation_mode: stata
related_refs: [regression-diagnostics, descriptive-statistics, limited-dependent-variables]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  regress price c.mpg##i.foreign weight, vce(robust)
  assert e(N) == 74
  margins foreign
  predict double fitted, xb
  assert !missing(fitted)
provenance:
  local_help_topics: [regress, ivregress, margins, predict]
  local_help_globs: []
  local_help_files:
  - ado/base/r/regress.sthlp
