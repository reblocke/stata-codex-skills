slug: date-time-functions
skill: core
section: Data operations
order: 160
title: Date and time conversion, arithmetic, and display
trigger: >-
  Use for converting string dates or timestamps to Stata numeric datetimes, applying %td/%tc formats,
  extracting components, calculating intervals, and working with daily, monthly, quarterly, or clock time.
commands:
- daily()
- clock()
- mofd()
- dofm()
- year()
- month()
- format %td
- format %tc
aliases: [Stata date, Stata datetime, timestamp conversion, date arithmetic, elapsed time]
routing_terms:
- daily() date conversion
- clock() timestamp conversion
- "%td date format"
- "%tc datetime format"
- monthly date arithmetic
- mofd() and dofm()
- extract year and month
source_topics:
- datetime
- datetime_conversion
- datetime_display_formats
- format
syntax_patterns:
- generate double event_date = daily(date_text, "YMD")
- generate double event_time = clock(timestamp, "YMDhms")
- format event_date %tdCCYY-NN-DD
- generate int event_month = mofd(event_date)
assumptions:
- Raw date strings have a known component order, time zone when relevant, and consistent precision.
- Date arithmetic uses a single declared Stata time scale and a scientifically appropriate time origin.
gotchas:
- A display format changes how a numeric datetime looks but does not convert string data or change its units.
- Daily dates count days from 01jan1960, while datetime values count milliseconds; mixing them gives implausible intervals.
- Use double storage for %tc datetime values because float cannot represent millisecond-scale values precisely.
workflows:
- Inspect raw strings, convert with an explicit mask, format the numeric result, and count failed conversions.
- Convert both endpoints to the same time scale before subtracting and assert plausible interval bounds.
validation_case: >-
  Convert known daily and clock strings, apply display formats, extract calendar components, and assert exact
  dates and elapsed hours.
validation_mode: stata
related_refs:
- string-functions
- variables-operators
install_commands: []
smoke_test: |-
  clear
  input str10 date_text str19 timestamp
  "2026-07-24" "2026-07-24 12:30"
  end
  generate double event_date = daily(date_text, "YMD")
  generate double event_time = clock(timestamp, "YMDhm")
  format event_date %tdCCYY-NN-DD
  format event_time %tcCCYY-NN-DD_HH:MM
  assert year(event_date) == 2026
  assert month(event_date) == 7
  assert day(event_date) == 24
provenance:
  local_help_topics: [datetime, datetime_conversion, datetime_display_formats, format]
  local_help_globs: []
  local_help_files:
  - ado/base/d/datetime.sthlp
  - ado/base/d/datetime_conversion.sthlp
  - ado/base/d/datetime_display_formats.sthlp
  - ado/base/f/format.sthlp
  upstream_files:
  - plugins/stata/skills/stata/references/date-time-functions.md
  upstream_only: false
  package_only: false
  reviewed: true
