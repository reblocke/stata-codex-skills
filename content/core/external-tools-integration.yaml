slug: external-tools-integration
skill: core
section: Output and workflow
order: 540
title: Python, shell, and Java integration boundaries
trigger: >-
  Use for calling Python from Stata, PyStata integration, shell commands, Java plugins,
  environment discovery, quoting paths, subprocess return codes, and controlled data exchange with external tools.
commands: [python, python query, shell, java, javacall, Stata Function Interface]
aliases: [Python integration, PyStata, shell command, Java plugin, external process, SFI]
routing_terms:
- python query in Stata
- PyStata setup
- shell command from Stata
- javacall plugin invocation
- SFI data exchange
- external executable return code
source_topics: [pystata_intro, shell, java_plugin]
syntax_patterns:
- python script "analysis.py", args("--input" "data.csv")
- shell "/usr/bin/tool" "--input" "data.csv"
- javacall com.example.Plugin run, jars(plugin.jar) args(arguments)
assumptions:
- The external runtime, executable, libraries, and versions are available and explicitly identified.
- Inputs and outputs cross the Stata boundary through documented paths or APIs without exposing secrets or restricted data.
gotchas:
- Shell quoting differs across operating systems, and untrusted interpolated text can become command injection.
- A successful process launch does not prove the external command produced complete or valid output.
- Python or Java state can persist within a session and make reruns depend on earlier imports or objects.
- "`python query` returns `r(111)` when Stata has no Python installation configured; treat that as an environment preflight result, not proof that Python integration works."
- Licensed validation denies child-process creation at launch, so `shell` and external-executable calls require a separate, explicitly authorized integration test.
workflows:
- Query the runtime and versions, test a minimal no-data call, then add explicit paths, arguments, timeouts, and return-code checks.
- Exchange only required data through temporary files or documented APIs, validate the returned schema, and clean temporary artifacts.
validation_case: >-
  Query Stata's Python integration without starting an external child process,
  accept only configured metadata or the documented unconfigured-runtime result,
  and require an error-free isolated log.
validation_mode: stata
related_refs: [workflow-best-practices, advanced-programming]
install_commands: []
smoke_test: |-
  clear all
  capture quietly python query
  local python_query_rc = _rc
  assert inlist(`python_query_rc', 0, 111)
  if `python_query_rc' == 0 {
      assert inlist(r(initialized), 0, 1)
      assert "`r(execpath)'" != ""
  }
