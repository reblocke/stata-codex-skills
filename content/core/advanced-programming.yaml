slug: advanced-programming
skill: core
section: Programming and Mata
order: 20
title: Reusable Stata programs and returned results
trigger: >-
  Use for defining `.ado` programs, parsing `syntax`, respecting `if`/`in` qualifiers and weights, returning
  `r()` or `e()` results, managing program versions, preserving data, and writing estimation-command interfaces.
commands: [program define, syntax, marksample, return, ereturn, preserve, restore, version]
aliases: [ado programming, Stata program, rclass, eclass, syntax parser, returned results]
routing_terms:
- program define
- syntax varlist parser
- rclass program
- eclass estimation command
- marksample qualifier handling
- ereturn post results
- ado command development
source_topics: [program, syntax, return, ereturn]
syntax_patterns:
- |-
  program define codex_mean, rclass
      version 18
      syntax varname(numeric) [if] [in] [aweight]
      marksample touse
      if "`weight'" == "" {
          quietly summarize `varlist' if `touse', meanonly
      }
      else {
          quietly summarize `varlist' [`weight'`exp'] if `touse', meanonly
      }
      local result_mean = r(mean)
      local result_n = r(N)
      return scalar mean = `result_mean'
      return scalar N = `result_n'
  end
- ereturn post b V, esample(touse)
assumptions:
- The `codex_mean` example requires Stata 18, a numeric variable, and optional `if`/`in` and analytic weights; it returns `r(mean)` and `r(N)` without changing data.
- The `ereturn post` line is a fragment inside a separate `eclass` program with conformable named `b` and `V` matrices and a marked sample.
- "`if`/`in` qualifiers, weights, missingness, and current estimation state are handled deliberately."
gotchas:
- A program that ignores `marksample` can silently estimate on observations excluded by the caller.
- "`r()` results are overwritten by many commands; copy values before issuing another `rclass` command."
- "`preserve` must be paired with `restore` on every exit path, including handled errors."
- An `eclass` command must post conformable coefficient and variance matrices with stable names.
workflows:
- Write the public syntax and returned-results contract first, then implement a minimal valid path and explicit error checks.
- Test valid, boundary, and invalid inputs in clean sessions; verify data restoration and returned results after each path.
validation_case: >-
  Execute the published `rclass` body with `if`/`in` and analytic weights, compare named returns with a known weighted mean,
  and reject unsupported frequency weights without data changes.
validation_mode: stata
related_refs: [programming-basics, mata-programming]
install_commands: []
smoke_test: |-
  clear all
  capture program drop codex_mean
  program define codex_mean, rclass
      version 18
      syntax varname(numeric) [if] [in] [aweight]
      marksample touse
      if "`weight'" == "" {
          quietly summarize `varlist' if `touse', meanonly
      }
      else {
          quietly summarize `varlist' [`weight'`exp'] if `touse', meanonly
      }
      local result_mean = r(mean)
      local result_n = r(N)
      return scalar mean = `result_mean'
      return scalar N = `result_n'
  end
  input byte id double x double w
  1 2 1
  2 4 1
  3 6 2
  4 8 2
  end
  codex_mean x if id >= 2 in 1/3 [aw=w]
  assert r(N) == 2
  assert abs(r(mean) - 16/3) < 1e-12
  capture noisily codex_mean x [fw=w]
  assert _rc != 0
  assert _N == 4
  assert x[4] == 8
