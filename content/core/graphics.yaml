slug: graphics
skill: core
section: Output and Workflow
order: 510
title: Stata Graphics for Analysis and Publication
trigger: >-
  Use for scatterplots, line and fitted plots, histograms, distributions, confidence intervals,
  graph combination, schemes, direct labels, axis control, and deterministic graph export.
commands: [twoway, scatter, line, histogram, graph combine, graph export, set scheme]
aliases: [Stata graph, plot, scatterplot, histogram, twoway, figure, graph export]
source_topics: [graph, graph_twoway, histogram, scatter]
syntax_patterns:
- twoway (scatter outcome exposure) (lfit outcome exposure), legend(off)
- histogram outcome, fraction normal
- graph combine panel_a panel_b, col(2)
- graph export "figure.png", width(2400) replace
assumptions:
- The graph encodes a prespecified substantive comparison at the correct observational and uncertainty level.
- Export dimensions, colors, fonts, and labels remain legible at the final display or manuscript size.
gotchas:
- Default axis ranges and category ordering can obscure the comparison or exaggerate small changes.
- Color alone is not an accessible grouping channel; reinforce groups with symbols, line patterns, or direct labels.
- Graph export replace overwrites files, and named graphs can be silently reused if replace is specified.
workflows:
- State the comparison, choose the simplest mark and meaningful order, then inspect missingness and denominators behind each element.
- Build at final size, use readable typography and grayscale-safe encodings, and verify the exported artifact rather than only the viewer.
validation_case: >-
  Create a named scatter-plus-fit graph from bundled data without displaying it, verify the graph exists,
  and drop it without writing a repository artifact.
validation_mode: stata
related_refs: [descriptive-statistics, tables-reporting]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  twoway (scatter price mpg) (lfit price mpg), legend(off) name(core_graph_smoke, replace) nodraw
  graph describe core_graph_smoke
  assert "`r(ft)'" == "live"
  assert "`r(family)'" == "twoway"
  graph drop core_graph_smoke
provenance:
  local_help_topics: [graph, graph_describe, graph_twoway, histogram, scatter]
  local_help_globs: []
  local_help_files:
  - ado/base/g/graph.sthlp
  - ado/base/g/graph_describe.sthlp
  - ado/base/g/graph_twoway.sthlp
  - ado/base/h/histogram.sthlp
  - ado/base/s/scatter.sthlp
  upstream_files:
  - plugins/stata/skills/stata/references/graphics.md
  upstream_only: false
  package_only: false
  reviewed: true
