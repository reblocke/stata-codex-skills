slug: data-management
skill: core
section: Data operations
order: 130
title: Data management in Stata
trigger: >-
  Use for generating or replacing variables, validating keys, merging or appending datasets, reshaping,
  collapsing, detecting duplicates, and constructing grouped variables with `egen`.
commands:
- generate
- replace
- isid
- duplicates
- merge
- joinby
- append
- reshape
- collapse
- egen
aliases: [merge data, join data, append data, reshape data, collapse data, duplicate keys, data cleaning]
routing_terms:
- merge 1:1 key
- merge m:1 key
- append using datasets
- reshape long to wide
- reshape wide to long
- collapse by group
- isid key validation
- duplicates report
source_topics:
- generate
- merge
- joinby
- duplicates
- isid
- append
- reshape
- collapse
- egen
syntax_patterns: []
assumptions:
- Entity and observation keys have a documented meaning and expected cardinality in every input.
- Data transformations preserve the intended analysis unit or explicitly create a new documented unit.
gotchas:
- Verify key uniqueness with `isid` or `duplicates` before choosing `1:1`, `m:1`, or `1:m` `merge` cardinality.
- Missing key values can match other missing values and cannot identify real entities; audit them before merging.
- "`merge` retains master-only and using-only rows by default; inspect `_merge` before filtering or dropping it."
- Avoid `merge m:m` because it performs positional matching within key groups rather than a relational join.
- "`collapse` replaces the data in memory, so `preserve` or save a derived copy before destructive aggregation."
workflows:
- Determine the real key, assert its cardinality on both datasets, `merge`, tabulate `_merge`, and assert the intended disposition.
- Use `joinby` only when every within-key combination is substantively meaningful and verify the expected Cartesian row count.
- Use `reshape` on a small copy first, assert the `i()` identifier, and verify that suffixes or `j()` values map to the intended occasions.
validation_case: >-
  Assert matched, master-only, and using-only merge rows; verify grouped means and keys after `collapse`;
  and establish known within-key Cartesian counts after `joinby`.
validation_mode: stata
related_refs:
- variables-operators
- workflow-best-practices
install_commands: []
smoke_test: null
examples:
- id: core-merge-disposition
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [Synthetic master and using data are created in separate temporary files; group is unique in using data.]
  code: |-
    tempfile groups
    clear
    input group str4 label
    1 "one"
    2 "two"
    4 "four"
    end
    isid group
    save `groups'
    clear
    input id group value
    1 1 10
    2 1 20
    3 2 30
    4 3 40
    end
    isid id
    merge m:1 group using `groups'
  test_id: core-merge-disposition
  fixture: tests/stata/examples/core-merge-disposition.yaml
  expected_rc: 0
- id: core-joinby-cardinality
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [Every within-firm employee-contract pair is substantively intended.]
  code: |-
    tempfile contracts
    clear
    input str1 firm str2 contract
    "A" "c1"
    "A" "c2"
    "A" "c3"
    "B" "c4"
    end
    isid firm contract
    save `contracts'
    clear
    input str1 firm str2 employee
    "A" "e1"
    "A" "e2"
    "B" "e3"
    end
    joinby firm using `contracts'
  test_id: core-joinby-cardinality
  fixture: tests/stata/examples/core-joinby-cardinality.yaml
  expected_rc: 0
- id: core-collapse-means
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [Numeric `value` and numeric `group` variables; aggregation replaces the data in memory.]
  code: collapse (mean) mean_value=value, by(group)
  test_id: core-collapse-means
  fixture: tests/stata/examples/core-collapse-means.yaml
  expected_rc: 0
- id: core-duplicate-key-error
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [Synthetic data deliberately contain a duplicate `id` key.]
  code: isid id
  test_id: core-duplicate-key-error
  fixture: tests/stata/examples/core-duplicate-key-error.yaml
  expected_rc: 459
- id: core-missing-key-error
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [Synthetic data deliberately contain a missing `id` key.]
  code: isid id
  test_id: core-missing-key-error
  fixture: tests/stata/examples/core-missing-key-error.yaml
  expected_rc: 459
- id: core-reshape-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [A unique `id` and consistently suffixed `measure` columns for each time value.]
  code: reshape long measure, i(id) j(time)
