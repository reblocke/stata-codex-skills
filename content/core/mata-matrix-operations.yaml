slug: mata-matrix-operations
skill: core
section: Programming and Mata
order: 40
title: Stata and Mata Matrix Operations
trigger: >-
  Use for constructing, naming, subsetting, transposing, joining, solving, decomposing, and transferring
  matrices between Stata and Mata.
commands: [matrix define, matrix list, matrix rownames, mata, invsym(), qrsolve(), st_matrix()]
aliases: [matrix algebra, Stata matrix, Mata matrix, linear solve, matrix inverse]
routing_terms:
- matrix define in Stata
- matrix rownames
- invsym() symmetric inverse
- qrsolve() linear system
- transpose and join Mata matrices
- Stata-to-Mata matrix transfer
source_topics: [matrix, matrix_operators, mata]
syntax_patterns:
- matrix A = (1,2 \ 3,4)
- matrix colnames A = first second
- "mata: b = qrsolve(X, y)"
- "mata: st_matrix(\"result\", cross(X, X))"
assumptions:
- Matrix dimensions are conformable and row/column ordering carries the intended scientific meaning.
- The chosen solver or decomposition is numerically appropriate for rank and conditioning.
gotchas:
- Explicit matrix inversion is usually less stable than solving a linear system with qrsolve() or cholsolve().
- Stata matrix row and column names can be lost or reordered during transfers unless managed explicitly.
- Symmetric-only routines such as invsym() assume symmetry and may mask a construction error.
workflows:
- Assert dimensions and rank before solving, use decomposition-based solvers, and verify residuals against a tolerance.
- Attach semantic row/column names at interfaces and test round-trips between Stata matrices and Mata.
validation_case: >-
  Define a full-rank matrix, solve a linear system in Mata, and verify the residual norm is below tolerance.
validation_mode: stata
related_refs: [mata-introduction, mata-programming]
install_commands: []
smoke_test: |-
  clear all
  matrix A = (1,2 \ 3,5)
  matrix b = (5 \ 11)
  mata:
  A = st_matrix("A")
  b = st_matrix("b")
  x = qrsolve(A, b)
  assert(max(abs(A*x-b)) < 1e-10)
  st_matrix("solution", x)
  end
  matrix list solution
