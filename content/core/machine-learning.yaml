slug: machine-learning
skill: core
section: Advanced methods
order: 650
title: Built-in predictive machine learning and double-selection inference
trigger: >-
  Use for penalized linear, logit, probit, or Poisson models; cross-validation or `selection(plugin)`;
  lasso predictions; elastic net; H2O random forests or gradient boosting; and inferential double
  selection with `dsregress`.
commands: [lasso, elasticnet, lassocoef, lassogof, predict, dsregress, h2o init, _h2oframe put, h2oml rfregress, h2oml gbregress]
aliases: [machine learning, lasso, elastic net, penalized regression, variable selection, double selection, random forest, gradient boosting, h2oml]
routing_terms:
- lasso linear
- elasticnet linear
- dsregress double selection
- lassocoef selected variables
- cross-validation for lasso
- H2O random forest in Stata
- h2oml gradient boosting
source_topics: [lasso, elasticnet, dsregress, h2o_intro, h2oml, h2oml_rf, h2oml_gbm]
syntax_patterns:
- lasso linear outcome candidate_predictors, selection(cv, folds(10))
- elasticnet linear outcome candidate_predictors, alphas(0.5)
- dsregress outcome treatment, controls(candidate_controls)
- predict double prediction
- _h2oframe put, into(training)
- h2oml rfregress outcome predictors, cv(5) ntrees(100)
- h2oml gbregress outcome predictors, cv(5) ntrees(100)
assumptions:
- Training and validation observations represent the target deployment population and are split without leakage.
- Prediction loss or the double-selection estimand is defined before tuning and model comparison.
gotchas:
- Lasso-selected variables are unstable under correlated predictors and do not become causal confounders by selection.
- Ordinary post-selection standard errors after prediction-oriented lasso ignore the selection process.
- Cross-validation must respect clustering, time order, and preprocessing boundaries to avoid optimistic performance.
- "`h2oml` commands operate on the current H2O frame rather than directly on the active Stata frame; initialize H2O and transfer only the intended columns."
workflows:
- Define the prediction target and validation scheme, freeze preprocessing, tune on training data, and evaluate once on held-out data.
- Use `dsregress` for its inferential target rather than treating a predictive lasso fit as valid treatment-effect inference.
- For random forests or gradient boosting, initialize H2O, create a named H2O frame, set a reproducible seed, bound the tuning grid, and shut down resources after validation.
validation_case: >-
  Fit a deterministic plugin-selected lasso on bundled data, generate predictions, and verify the estimation sample and
  nonmissing predictions.
validation_mode: stata
related_refs: [linear-regression, workflow-best-practices]
install_commands: []
smoke_test: |-
  clear all
  sysuse auto, clear
  lasso linear price mpg weight length turn displacement, selection(plugin)
  assert e(N) == 74
  predict double prediction
  assert !missing(prediction)
