slug: event-study
skill: packages
section: Graphics and diagnostics
order: 220
title: Event-study estimation and plotting packages
trigger: Use when the user asks for eventstudyinteract, eventdd, event_plot, a Sun-Abraham interaction-weighted estimator, dynamic treatment effects, lead/lag plots, endpoint binning, pretrend tests, or modern event studies under staggered adoption.
aliases:
- eventstudyinteract
- eventdd
- event_plot
- Sun-Abraham
- event study
- leads and lags
routing_terms:
- eventstudyinteract Sun-Abraham estimator
- eventdd lead-lag plot
- event_plot dynamic treatment effects
- staggered-adoption event-study coefficients
- pretrend test with endpoint binning
commands:
- eventstudyinteract
- eventdd
- event_plot
source_topics:
- eventstudyinteract
- eventdd
- event_plot
syntax_patterns:
- eventstudyinteract outcome leadvars lagvars, cohort(first_treat) control_cohort(never_treated) absorb(unit time) vce(cluster unit)
- eventdd outcome controls, timevar(relative_time) baseline(-1) leads(4) lags(6) cluster(unit)
- event_plot stored_result, default_look together
assumptions:
- Treatment timing, never/not-yet-treated controls, anticipation window, and reference period are defined before constructing event-time indicators.
- Each plotted horizon has adequate treated and comparison support, and standard errors are clustered at the treatment-assignment level.
gotchas:
- A conventional two-way fixed-effects lead/lag regression can mix cohort-specific effects under staggered treatment; choose an estimator that matches the design.
- Omit exactly one reference period and bin sparse tails deliberately. Collinearity-driven omissions are not a substitute for a prespecified baseline.
- A nonsignificant joint pretrend test has limited power and does not prove parallel trends; show estimates, uncertainty, and support.
workflows:
- Preflight the chosen estimator and its dependencies with which/ado describe; ask before installing or updating them.
- Validate first-treatment timing and irreversible adoption, create and tabulate event time, choose supported horizons and controls, then estimate.
- Store the result, test the prespecified preperiod coefficients, and plot with a zero line, labeled reference period, and support-aware endpoints.
validation_case: On a bounded nlswork panel, construct first union year and event-time indicators, run eventstudyinteract with never-treated controls and clustered errors, and require an error-free log.
validation_mode: stata
related_refs:
- difference-in-differences
- did
- graphics
preflight_commands:
- which require
- which eventstudyinteract
- which reghdfe
- which avar
- ado describe require
- ado describe eventstudyinteract
install_commands:
- net install require, from("https://raw.githubusercontent.com/sergiocorreia/stata-require/7ee750b12f9c51ec8a879445cbf39357c308bdee/src/")
- ssc install ftools
- ssc install reghdfe
- ssc install avar
- ssc install eventstudyinteract
- ssc install eventdd
- ssc install event_plot
smoke_test: |
  webuse nlswork, clear
  keep if inrange(year, 70, 82)
  generate union_year = year if union == 1
  bysort idcode: egen first_union = min(union_year)
  drop union_year
  generate rel_year = year - first_union
  generate never_union = missing(first_union)
  generate lead3 = rel_year == -3
  generate lead2 = rel_year == -2
  generate event0 = rel_year == 0
  generate lag1 = rel_year == 1
  generate lag2 = rel_year == 2
  eventstudyinteract ln_wage lead3 lead2 event0 lag1 lag2, cohort(first_union) control_cohort(never_union) absorb(idcode year) vce(cluster idcode)
  assert e(N) > 0
