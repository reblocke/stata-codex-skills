slug: nprobust
skill: packages
section: Estimation Packages
order: 140
title: "nprobust Suite: Robust Nonparametric Estimation"
trigger: Use when the user asks for nprobust, lprobust, lpbwselect, kdrobust, kdbwselect, local-polynomial regression, kernel-density inference, robust bias correction, derivative estimation, or data-driven nonparametric bandwidths.
aliases:
- nprobust
- lprobust
- lpbwselect
- kdrobust
- kdbwselect
- local polynomial
- robust bias correction
routing_terms:
- lprobust local-polynomial regression
- nprobust robust bias correction
- local polynomial regression
- lpbwselect nonparametric bandwidth
- kdrobust kernel-density inference
- local-polynomial derivative estimation
commands:
- lprobust
- lpbwselect
- kdrobust
- kdbwselect
source_topics:
- nprobust
- lprobust
- lpbwselect
- kdrobust
- kdbwselect
syntax_patterns:
- lprobust depvar indepvar, p(1) q(2) bwselect(ce-dpi)
- lprobust depvar indepvar, deriv(1) vce(cluster clustvar)
- kdrobust varname, kernel(epanechnikov) genvars
- lpbwselect depvar indepvar, p(1) bwselect(all)
assumptions:
- The outcome/running variable has adequate local support over the requested evaluation grid.
- Polynomial order, derivative, kernel, bandwidth objective, and VCE correspond to a prespecified inferential target.
gotchas:
- Polynomial order p(), bias-correction order q(), derivative order, and bandwidth criterion jointly determine the target and inference; report all of them.
- Generated result variables use fixed prefixes and can collide with earlier runs. Drop or rename them deliberately before requesting genvars.
- Boundary behavior and sparse evaluation regions can dominate nonparametric results; inspect effective sample sizes and support rather than relying only on a smooth plot.
workflows:
- Run which lprobust, which kdrobust, and ado describe nprobust before use; obtain authorization before installing the pinned source.
- Choose the estimand and derivative, inspect support, select bandwidths, then fit and visualize using the same evaluation grid.
- Compare reasonable kernels/bandwidth criteria as sensitivity analyses while keeping the inferential target fixed.
validation_case: Run lprobust for mpg on weight in auto.dta from the immutable source, verify it produces estimates without r() errors, and keep generated artifacts inside the temporary work directory.
validation_mode: stata
related_refs:
- nonparametric-methods
- graphics
preflight_commands:
- which lprobust
- which kdrobust
- ado describe nprobust
install_commands:
- net install nprobust, from("https://raw.githubusercontent.com/nppackages/nprobust/dfcb562d34822c75528c1c2d8a5a153be6b3a683/stata")
smoke_test: |
  sysuse auto, clear
  lprobust mpg weight
