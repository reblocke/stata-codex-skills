- net
- adofile
- adoupdate
- sysdir
- which
syntax_patterns:
- which command_name
- ado describe package_name
- ssc describe package_name
- ssc install package_name
- net install package_name, from("immutable_source_url")
- sysdir set PLUS "project/ado/plus"
assumptions:
- Package installation, update, or removal is an external state change that requires the user's authorization in their active Stata environment.
- Reproducible work records the source channel and resolved version or commit and isolates project dependencies when practical.
gotchas:
- "`search`, `findit`, `ssc`, and `net` are built-in lifecycle tools, not community estimation packages; this reference lives here because it governs community-package management."
- "`ssc install ..., replace` and `ado update, update` mutate the active environment and can silently change results; inspect first and pin or record the resolved version."
- "`adopath` precedence can load a different copy than expected. Check `which` and `ado describe` in the same session that runs the analysis."
workflows:
- Inspect with `which`, `ado describe`, `adopath`, and `sysdir` before proposing any change.
- Ask for authorization, then prefer a project-specific `PLUS` directory and a pinned or lock-verifiable source; never default to `replace`.
- After installation, reopen a clean session, verify `which` and `ado describe`, run a package-specific smoke test, and record source/version metadata.
validation_case: In batch mode without network or mutation, display `sysdir` and `adopath`, locate the built-in `regress` command with `which`, and require an error-free log.
validation_mode: stata
