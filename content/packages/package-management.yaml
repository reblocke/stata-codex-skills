slug: package-management
skill: packages
section: Data and workflow utilities
order: 320
title: Built-in Stata tooling for community-package lifecycle management
trigger: Use when the user asks how to search, inspect, install, pin, update, remove, isolate, or troubleshoot community-contributed Stata packages with `findit`, `search`, `ssc`, `net`, `ado`, `which`, `adopath`, `sysdir`, or `net set ado`.
aliases:
- package management
