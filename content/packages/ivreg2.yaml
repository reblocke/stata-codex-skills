slug: ivreg2
skill: packages
section: Estimation packages
order: 130
title: "ivreg2, xtivreg2, and ivreghdfe: Instrumental-variables workflows"
trigger: Use when the user asks for ivreg2, xtivreg2, ivreghdfe, ranktest, weak-instrument diagnostics, first-stage statistics, LIML, GMM, overidentification tests, endogenous-regressor tests, HAC inference, or IV with high-dimensional fixed effects.
aliases:
- ivreg2
- xtivreg2
- ivreghdfe
- ranktest
- weak instruments
- LIML
- instrumental variables
routing_terms:
- ivreg2 weak-instrument diagnostics
- ivreghdfe instrumental-variable model
- LIML or GMM instrumental-variable estimation
- Kleibergen-Paap rank test
- overidentification diagnostics after ivreg2
commands:
- ivreg2
- xtivreg2
- ivreghdfe
- ranktest
source_topics:
- ivreg2
- xtivreg2
- ivreghdfe
- ranktest
syntax_patterns:
- ivreg2 depvar exogvars (endogvars = excluded_instruments), first robust
- ivreg2 depvar exogvars (endogvars = excluded_instruments), liml first cluster(clustvar)
- xtivreg2 depvar exogvars (endogvars = excluded_instruments), fe cluster(panel_id)
- ivreghdfe depvar exogvars (endogvars = excluded_instruments), absorb(firm_id year) cluster(firm_id)
assumptions:
- Excluded instruments are relevant and satisfy a defensible exclusion restriction conditional on included covariates.
- The clustering/HAC structure and fixed effects match the sampling and treatment-assignment process.
gotchas:
- Instrument relevance does not establish exclusion. State and defend the exclusion restriction before interpreting any IV estimate.
- Use heteroskedasticity- or cluster-robust weak-identification statistics that correspond to the requested VCE; the conventional first-stage F is not a universal threshold.
- ivreghdfe has additional ftools/reghdfe dependencies and option differences. Verify installed versions together before debugging syntax.
workflows:
- Preflight every requested command with which and ado describe; request authorization before installing or changing the dependency stack.
- Inspect the first stage, weak-identification statistic, reduced form, overidentification conditions, and clustering structure before selecting 2SLS, LIML, or GMM.
- For high-dimensional fixed effects, document absorbed effects and cluster dimensions and compare a smaller ivreg2 specification when feasible.
validation_case: In auto.dta, construct two excluded instruments, run a robust ivreg2 model with first-stage output, and verify e(N), the coefficient vector, and an error-free log.
validation_mode: stata
related_refs:
- linear-regression
- gmm-estimation
- reghdfe
preflight_commands:
- which ivreg2
- which ranktest
- which ivreghdfe
- ado describe ivreg2
install_commands:
- ssc install ranktest
- ssc install ivreg2
- ssc install xtivreg2
- ssc install ftools
- ssc install reghdfe
- net install ivreghdfe, from("https://raw.githubusercontent.com/sergiocorreia/ivreghdfe/bfb5577a6dbdfb029ab4ab6a7e93f7257a827b42/src/")
smoke_test: |
  sysuse auto, clear
  generate double excluded1 = turn + trunk
  generate double excluded2 = length + headroom
  ivreg2 price weight (mpg = excluded1 excluded2), first robust
  assert e(N) > 0
  assert colsof(e(b)) > 0
  assert !missing(_b[mpg])
