slug: synth
skill: packages
section: Estimation Packages
order: 180
title: "synth: Synthetic-Control Estimation"
trigger: Use when the user asks for synth, synthetic control, donor weights, predictor weights, pre-treatment RMSPE, placebo/permutation inference, leave-one-out donor sensitivity, or treatment gaps.
aliases:
- synth
- synthetic control
- donor weights
- placebo gaps
- RMSPE
routing_terms:
- synth synthetic-control estimator
- donor and predictor weights
- placebo-gap inference for synthetic control
- pre-treatment RMSPE assessment
- leave-one-out donor sensitivity
commands:
- synth
source_topics:
- synth
syntax_patterns:
- synth outcome predictors outcome(preperiods), trunit(unit) trperiod(period) xperiod(preperiods)
- synth outcome predictors, trunit(unit) trperiod(period) counit(donor_units) keep(results.dta) replace
assumptions:
- No donor is exposed to treatment or spillovers during the relevant period, and the treated unit has a credible convex combination in the donor pool.
- Predictors and optimization periods use only pre-treatment information and provide adequate pre-treatment fit.
gotchas:
- Treatment must occur for one identified unit at a known period, with an untreated donor pool and no donor contamination during the outcome window.
- Predictor periods, optimization periods, and reported result periods serve different roles; state each explicitly and use only pre-treatment information for fitting.
- Conventional regression p-values are not the default inferential framework; assess placebo gaps, pre-treatment fit, donor weights, and sensitivity to influential donors.
workflows:
- Preflight synth with which and ado describe; ask before installing or updating the package.
- Declare panel structure, treatment unit/period, donor exclusions, predictors, and pre-treatment periods before optimization.
- Inspect predictor balance, donor weights, RMSPE, and the full gap path, then run prespecified placebo and leave-one-out checks.
validation_case: Generate a seeded balanced panel with one treated unit and five donors, run synth using only pre-treatment predictors, and verify donor-weight and result matrices are returned without errors.
validation_mode: stata
related_refs:
- treatment-effects
- graphics
preflight_commands:
- which synth
- ado describe synth
install_commands:
- ssc install synth
smoke_test: |
  clear
  set seed 271828
  set obs 60
  generate unit = ceil(_n / 10)
  bysort unit: generate year = 2000 + _n - 1
  xtset unit year
  generate double predictor = 5 + unit / 10 + runiform()
  generate double outcome = 10 + unit + 0.2 * (year - 2000) + predictor + rnormal()
  replace outcome = outcome + 3 if unit == 1 & year >= 2006
  synth outcome predictor(2001(1)2005) outcome(2003) outcome(2005), trunit(1) trperiod(2006)
  matrix list e(W_weights)
