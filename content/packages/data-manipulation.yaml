slug: data-manipulation
skill: packages
section: Data and workflow utilities
order: 310
title: Fast data-manipulation packages for Stata
trigger: Use when the user asks for `gtools`, `gcollapse`, `gegen`, `greshape`, `gisid`, `gquantiles`, `rangestat`, `egenmore`, `distinct`, `missings`, `carryforward`, or faster grouped aggregation, reshape, rolling-window, and missing-data utilities.
aliases:
- gtools
- gcollapse
- gegen
- greshape
- gisid
- gquantiles
- rangestat
- egenmore
- distinct
- missings
- carryforward
routing_terms:
- gtools fast grouped operations
- gcollapse large-data aggregation
- greshape large-data reshape
- rangestat rolling-window statistics
- audit and carry forward missing values
commands:
- gcollapse
- gegen
- greshape
- gisid
- gquantiles
- rangestat
- distinct
- missings
- carryforward
source_topics:
- gtools
- rangestat
- egenmore
- distinct
- missings
- carryforward
syntax_patterns:
- gcollapse (mean) mean_y=outcome (count) n=outcome, by(groupvars)
- gegen group_mean = mean(outcome), by(groupvars)
- greshape long stub, i(idvars) j(timevar)
- rangestat (mean) moving_y=outcome, interval(timevar -3 0) by(panel_id)
- gquantiles quartile = outcome, nquantiles(4)
- egen n_categories = nvals(category), by(groupvars)
- distinct keyvars, joint
- missings report outcome covariates
- 'bysort panel_id (timevar): carryforward status, replace'
assumptions:
- Group keys, sort order, missing-value rules, weights, and expected row counts are defined before substituting a faster community command.
- Any accelerated command is expected to reproduce the chosen built-in Stata operation on a small fixture before it is trusted on full data.
gotchas:
- "`gcollapse` replaces the dataset in memory, just like `collapse`; preserve or save an intermediate dataset when the current rows must survive."
- Community implementations can differ from built-ins in missing values, weights, storage types, sorting, and labels. Test the exact options used.
- "`carryforward` encodes a substantive last-observation-carried-forward assumption; do not use it as generic missing-data repair."
workflows:
- Preflight only the packages needed for the task with `which` and `ado describe`; obtain authorization before installing them.
- Reproduce the transformation with a small fixture or built-in analogue, assert keys and row counts, then run the accelerated command.
- Preserve source data, document grouping and window boundaries, and compare summaries/checksums before and after optimization.
validation_case: Run `gcollapse` on `auto.dta` by `foreign` status, verify two output rows and nonmissing group means, and require an error-free log.
validation_mode: stata
related_refs:
- data-management
- workflow-best-practices
preflight_commands:
- which gcollapse
- which gegen
- ado describe gtools
install_commands:
- ssc install gtools
- ssc install rangestat
- ssc install egenmore
- ssc install distinct
- ssc install missings
- ssc install carryforward
smoke_test: |
  sysuse auto, clear
  gcollapse (mean) mean_price=price mean_mpg=mpg (count) n=price, by(foreign)
  isid foreign
  assert _N == 2
  assert !missing(mean_price, mean_mpg, n)
