- egenmore
- distinct
- missings
- carryforward
syntax_patterns: []
assumptions:
- Group keys, sort order, missing-value rules, weights, and expected row counts are defined before substituting a faster community command.
- Any accelerated command is expected to reproduce the chosen built-in Stata operation on a small fixture before it is trusted on full data.
gotchas:
- "`gcollapse` replaces the dataset in memory, just like `collapse`; preserve or save an intermediate dataset when the current rows must survive."
- Community implementations can differ from built-ins in missing values, weights, storage types, sorting, and labels. Test the exact options used.
- "`carryforward` encodes a substantive last-observation-carried-forward assumption; do not use it as generic missing-data repair."
workflows:
- Preflight only the packages needed for the task with `which` and `ado describe`; obtain authorization before installing them.
- Reproduce the transformation with a small fixture or built-in analogue, assert keys and row counts, then run the accelerated command.
- Preserve source data, document grouping and window boundaries, and compare summaries/checksums before and after optimization.
validation_case: Run `gcollapse` on synthetic grouped values, verify both exact means and counts, unique group keys, and an error-free log; other utilities are not covered by this smoke.
validation_mode: stata
related_refs:
- data-management
- workflow-best-practices
preflight_commands:
- which gcollapse
- which gegen
- ado describe gtools
install_commands:
- ssc install gtools
- ssc install rangestat
- ssc install egenmore
- ssc install distinct
- ssc install missings
- ssc install carryforward
smoke_test: null
examples:
- id: package-gcollapse-means
  language: stata
  kind: runnable
  min_version: 18
  prerequisites: [The reviewed `gtools` installation in an isolated PLUS directory and synthetic numeric `group` and `outcome` variables.]
  code: gcollapse (mean) mean_y=outcome (count) n=outcome, by(group)
  test_id: package-gcollapse-means
  fixture: tests/stata/examples/package-gcollapse-means.yaml
  expected_rc: 0
- id: package-gegen-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `gtools` and defined `outcome` and `groupvars` variables.]
  code: gegen group_mean = mean(outcome), by(groupvars)
- id: package-greshape-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `gtools`, unique `idvars`, and consistently suffixed `stub` variables.]
  code: greshape long stub, i(idvars) j(timevar)
- id: package-gquantiles-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `gtools`, numeric outcome values, and a declared quantile/missingness policy.]
  code: gquantiles quartile = outcome, nquantiles(4)
- id: package-rangestat-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `rangestat`; defined outcome, time, panel, and inclusive window endpoints.]
  code: rangestat (mean) moving_y=outcome, interval(timevar -3 0) by(panel_id)
- id: package-egenmore-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `egenmore` and defined category and grouping variables.]
  code: egen n_categories = nvals(category), by(groupvars)
- id: package-distinct-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `distinct` and defined key variables.]
  code: distinct keyvars, joint
- id: package-missings-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `missings` and defined outcome and covariate variables.]
  code: missings report outcome covariates
- id: package-carryforward-fragment
  language: stata
  kind: fragment
  min_version: 18
  prerequisites: [Installed `carryforward`; declared panel/time order and an explicit last-observation-carried-forward policy.]
  code: 'bysort panel_id (timevar): carryforward status, replace'
