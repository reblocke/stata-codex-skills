order: 310
title: Fast data-manipulation packages for Stata
trigger: Use when the user asks for `gtools`, `gcollapse`, `gegen`, `greshape`, `gisid`, `gquantiles`, `rangestat`, `egenmore`, `distinct`, `missings`, `carryforward`, or faster grouped aggregation, reshape, rolling-window, and missing-data utilities.
aliases:
