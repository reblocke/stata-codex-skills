- gcollapse
- gegen
- greshape
- gisid
- gquantiles
- rangestat
- egenmore
- distinct
- missings
- carryforward
routing_terms:
- gtools fast grouped operations
- gcollapse large-data aggregation
- greshape large-data reshape
- rangestat rolling-window statistics
- audit and carry forward missing values
commands:
- gcollapse
- gegen
- greshape
- gisid
- gquantiles
- rangestat
- distinct
- missings
- carryforward
route_cues: [gcollapse, rangestat, distinct, carryforward]
source_topics:
- gtools
